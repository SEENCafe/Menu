name: Sync menu prices from Firestore

on:
  # اجرای فوری از پنل مدیریت (admin.js) بلافاصله بعد از ذخیره‌ی قیمت‌ها،
  # از طریق workflow_dispatch API با یک توکن محدود (فقط Actions: Read/write).
  # کرون زیر صرفاً یک پشتیبان است، برای وقتی که آن تریگر فوری به هر دلیلی
  # (مثلاً قطعی اتصال خود پنل مدیریت) اجرا نشود.
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node scripts/sync-menu.mjs

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- js/menu-data.js; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/menu-data.js
          git commit -m "chore: sync default menu from Firestore"
          git push
